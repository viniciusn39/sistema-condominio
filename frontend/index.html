    <script>
      // tema claro por padrão; o escuro só se o usuário escolher no menu da conta
      (function () {
        var t = "light";
        try { if (localStorage.getItem("tema") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-bs-theme", t);
      })();
    </script>
    <title>Quórum · Assembleias online</title>
